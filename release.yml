name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [version.json]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(jq -r .version version.json)
          grep -q "const VER=\"$V\"" app.js || { echo "VER in app.js does not match version.json"; exit 1; }
          NOTES=$(jq -r '.notes | map("- " + .) | join("\n")' version.json)
          if gh release view "v$V" >/dev/null 2>&1; then echo "already exists"; exit 0; fi
          gh release create "v$V" --title "Версия $V" --notes "$NOTES"
