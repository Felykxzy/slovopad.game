name: Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [version.json]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(jq -r .version version.json)
          grep -q "const VER=\"$V\"" app.js || { echo "VER in app.js does not match version.json"; exit 1; }
          NOTES=$(jq -r '.notes | map("- " + .) | join("\n")' version.json)
          if gh release view "v$V" >/dev/null 2>&1; then echo "already exists"; exit 0; fi
          gh release create "v$V" --title "Версия $V" --notes "$NOTES"
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare app
        shell: bash
        run: |
          V=$(jq -r .version version.json)
          mkdir -p desktop/game desktop/build
          cp index.html styles.css core.js app.js tutorial.js practice.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png desktop/game/
          cp desktop-app/assets/* desktop/build/
          cp desktop-app/main.js desktop/main.js
          jq --arg v "$V" '.version=$v' desktop-app/package.json > desktop/package.json
      - name: Build
        shell: bash
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --publish never
      - name: Upload files to the release
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(jq -r .version ../version.json)
          shopt -s nullglob
          FILES=(dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.blockmap dist/latest*.yml)
          echo "Files: ${FILES[@]}"
          [ ${#FILES[@]} -gt 0 ] || { echo "No build files found"; exit 1; }
          gh release upload "v$V" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Build custom installer (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(jq -r .version version.json)
          mkdir -p inst
          cp desktop-app/installer/main.js desktop-app/installer/preload.js desktop-app/installer/ui.html inst/
          jq --arg v "$V" '.version=$v' desktop-app/installer/package.json > inst/package.json
          cp desktop-app/assets/installer-icon.ico inst/icon.ico
          cp "desktop/dist/Slovopad-Setup-$V.exe" inst/setup.exe
          cd inst
          npm install
          npx electron-builder --win portable --publish never
          gh release upload "v$V" "dist/Slovopad-Installer-$V.exe" --clobber --repo "$GITHUB_REPOSITORY"

