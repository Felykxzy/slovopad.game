name: Desktop app
on:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare app
        shell: bash
        run: |
          V=$(jq -r .version version.json)
          mkdir -p desktop/game desktop/build
          cp index.html styles.css manifest.webmanifest *.js *.png desktop/game/
          cp desktop-app/assets/* desktop/build/
          cp desktop-app/main.js desktop/main.js
          jq --arg v "$V" '.version=$v' desktop-app/package.json > desktop/package.json
      - name: Build
        shell: bash
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: slovopad-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
