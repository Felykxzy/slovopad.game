name: Проверка
on:
  push:
    branches: [main]
    paths-ignore: ['.github/tg-message-id']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Синтаксис скриптов
        run: |
          for f in *.js backend/worker.js; do node --check "$f" || exit 1; done
          jq empty version.json manifest.webmanifest
      - name: Версия совпадает
        run: |
          V=$(jq -r .version version.json)
          grep -q "const VER=\"$V\"" app.js || { echo "Версия в app.js не совпадает с version.json ($V)"; exit 1; }
      - name: Файлы кэша на месте
        run: |
          for f in $(grep -o '"[A-Za-z0-9_./-]*\.\(js\|css\|html\|png\|webmanifest\|json\)\(?[^"]*\)\?"' sw.js | tr -d '"' | sed 's/?.*//'); do [ -e "$f" ] || { echo "sw.js ссылается на отсутствующий файл: $f"; exit 1; }; done
      - name: Офлайн-кэш совпадает с index.html
        run: |
          for u in $(grep -o '\(src\|href\)="[A-Za-z0-9_./-]*\.\(js\|css\)[^"]*"' index.html | sed 's/^[a-z]*="//; s/"$//'); do grep -qF "\"$u\"" sw.js || { echo "В sw.js нет файла с такой же ссылкой, как в index.html: $u"; exit 1; }; done
      - name: Тесты
        run: npm test
      - name: Проверка экранов
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          npm run smoke
