name: iOS glass preview
on:
  workflow_dispatch:
  push:
    branches: [preview-glass]
    paths: [ios-app/Sources/**, ios-app/project.yml, .github/workflows/ios-glass.yml]
permissions:
  contents: write
jobs:
  glass:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Проект
        working-directory: ios-app
        run: |
          export APP_VERSION=$(jq -r .version ../version.json)
          export APP_BUILD=$(( $(date +%s) / 60 ))
          xcodegen generate
      - name: Сборка для симулятора
        working-directory: ios-app
        run: |
          xcodebuild -project Slovopad.xcodeproj -scheme Slovopad -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild \
            CODE_SIGNING_ALLOWED=NO build
      - name: Снимок в симуляторе
        working-directory: ios-app
        run: |
          xcrun simctl list devices available | grep -i iphone | head -5
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices|to_entries[]|select(.key|test("iOS-2[6-9]"))|.value[]|select(.name|test("iPhone 1[6-9]|iPhone 2"))][0].udid')
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" simbuild/Build/Products/Debug-iphonesimulator/Slovopad.app
          xcrun simctl launch "$UDID" com.felykxzy.slovopad -shot
          sleep 40
          mkdir -p preview
          xcrun simctl io "$UDID" screenshot preview/glass-menu.png
          ls -la preview
      - name: Собрать IPA для телефона
        working-directory: ios-app
        run: |
          xcodebuild -project Slovopad.xcodeproj -scheme Slovopad -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Slovopad.app Payload/
          zip -qry Slovopad-glass.ipa Payload
      - name: Положить снимок в ветку и IPA в тестовый релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add -f ios-app/preview/glass-menu.png
          git commit -m "Снимок настоящего жидкого стекла" || true
          git pull --rebase origin preview-glass && git push origin HEAD:preview-glass
          gh release view glass-preview >/dev/null 2>&1 || gh release create glass-preview --prerelease --title "Тест жидкого стекла" --notes "Только для проверки"
          gh release upload glass-preview ios-app/Slovopad-glass.ipa --clobber
