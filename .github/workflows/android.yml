name: Android
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: write
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Собрать проект Android
        run: |
          V=$(jq -r .version version.json)
          mkdir -p app && cd app
          mkdir www && cp ../android-app/www/index.html www/
          cp ../android-app/capacitor.config.json .
          jq -n --arg v "$V" '{name:"slovopad-android",version:$v,private:true}' > package.json
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
          npx cap sync android
          # значок игры
          for d in android/app/src/main/res/mipmap-*dpi; do
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do convert ../icon-512.png -resize 192x192 "$d/$n.png"; done
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          # номер версии приложения
          CODE=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$V\"/" android/app/build.gradle
          # постоянная подпись, чтобы новую версию можно было ставить поверх старой
          mkdir -p ~/.android && cp ../android-app/debug.keystore ~/.android/debug.keystore
      - name: Собрать APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Положить в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(jq -r .version version.json)
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "Slovopad-$V.apk"
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "Версия $V" --notes "Версия $V"
          gh release upload "v$V" "Slovopad-$V.apk" --clobber
