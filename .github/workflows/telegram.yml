name: Telegram
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [version.json]
permissions:
  contents: write
concurrency: telegram
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send or update message
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
        run: |
          set -e
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || { echo "Нет секретов TG_BOT_TOKEN / TG_CHAT_ID"; exit 1; }
          V=$(jq -r .version version.json)
          mkdir -p out
          ZIP="out/slovopad-$V.zip"
          zip -q "$ZIP" index.html styles.css manifest.webmanifest sw.js version.json *.js *.png
          NOTES=$(jq -r '.notes | map("• " + .) | join("\n")' version.json)
          CAP=$(printf '🎮 СЛОВОПАД — версия %s\n\nЧто нового:\n%s\n\nКнопка «Играть» всегда открывает свежую версию.' "$V" "$NOTES")
          URL="https://felykxzy.github.io/slovopad.game/"
          KB=$(jq -nc --arg u "$URL" '{inline_keyboard:[[{text:"▶ Играть",web_app:{url:$u}}]]}')
          API="https://api.telegram.org/bot$TOKEN"
          MID=""; [ -f .github/tg-message-id ] && MID=$(cat .github/tg-message-id)
          OK=0
          if [ -n "$MID" ]; then
            MEDIA=$(jq -nc --arg c "$CAP" '{type:"document",media:"attach://f",caption:$c}')
            R=$(curl -sS "$API/editMessageMedia" -F chat_id="$CHAT" -F message_id="$MID" -F media="$MEDIA" -F f=@"$ZIP" -F reply_markup="$KB")
            echo "$R" | jq -c '{ok,description}'
            [ "$(echo "$R" | jq -r .ok)" = "true" ] && OK=1
          fi
          if [ "$OK" = 0 ]; then
            R=$(curl -sS "$API/sendDocument" -F chat_id="$CHAT" -F document=@"$ZIP" -F caption="$CAP" -F reply_markup="$KB")
            echo "$R" | jq -c '{ok,description}'
            [ "$(echo "$R" | jq -r .ok)" = "true" ] || exit 1
            echo "$R" | jq -r .result.message_id > .github/tg-message-id
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add .github/tg-message-id
            git commit -q -m "Telegram: номер сообщения"
            git push
          fi
