name: Telegram
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]
permissions:
  contents: write
concurrency: telegram
jobs:
  post:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send or update message
        env:
          TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          CHAT: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          [ -n "$TOKEN" ] && [ -n "$CHAT" ] || { echo "Нет секретов TG_BOT_TOKEN / TG_CHAT_ID"; exit 1; }
          V=$(jq -r .version version.json)
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download/v$V"
          ASSETS=$(gh release view "v$V" --json assets -q '.assets[].name' 2>/dev/null || true)
          echo "Файлы релиза: $ASSETS"
          ROW=()
          has() { echo "$ASSETS" | grep -qx "$1"; }
          has "Slovopad-Installer-$V.exe" && ROW+=("$(jq -nc --arg u "$BASE/Slovopad-Installer-$V.exe" '{text:"🪟 Windows",url:$u}')")
          has "Slovopad-$V.dmg" && ROW+=("$(jq -nc --arg u "$BASE/Slovopad-$V.dmg" '{text:"🍎 Mac",url:$u}')")
          has "Slovopad-$V.AppImage" && ROW+=("$(jq -nc --arg u "$BASE/Slovopad-$V.AppImage" '{text:"🐧 Linux",url:$u}')")
          DL=$(printf '%s\n' "${ROW[@]}" | jq -sc '.')
          PLAY=$(jq -nc --arg u "https://felykxzy.github.io/slovopad.game/" '[{text:"▶ Играть",web_app:{url:$u}}]')
          KB=$(jq -nc --argjson p "$PLAY" --argjson d "$DL" '{inline_keyboard: ([$p] + (if ($d|length)>0 then [$d] else [] end))}')
          NOTES=$(jq -r '.notes | map("• " + .) | join("\n")' version.json)
          TXT=$(printf '🎮 СЛОВОПАД — версия %s\n\nЧто нового:\n%s\n\n▶ Играть — открывается прямо в Telegram, всегда свежая версия.\nНиже — программа для компьютера.' "$V" "$NOTES")
          API="https://api.telegram.org/bot$TOKEN"
          MID=""; [ -f .github/tg-message-id ] && MID=$(cat .github/tg-message-id)
          OK=0
          if [ -n "$MID" ]; then
            R=$(curl -sS "$API/editMessageText" --data-urlencode chat_id="$CHAT" --data-urlencode message_id="$MID" --data-urlencode text="$TXT" --data-urlencode reply_markup="$KB")
            echo "$R" | jq -c '{ok,description}'
            [ "$(echo "$R" | jq -r .ok)" = "true" ] && OK=1
          fi
          if [ "$OK" = 0 ]; then
            R=$(curl -sS "$API/sendMessage" --data-urlencode chat_id="$CHAT" --data-urlencode text="$TXT" --data-urlencode reply_markup="$KB")
            echo "$R" | jq -c '{ok,description}'
            [ "$(echo "$R" | jq -r .ok)" = "true" ] || exit 1
            echo "$R" | jq -r .result.message_id > .github/tg-message-id
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add .github/tg-message-id
            git commit -q -m "Telegram: номер сообщения"
            git push
          fi
