name: Выкладка сервера

on:
  push:
    branches: [main]
    paths: ['backend/worker.js']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Настройки сервера
        working-directory: backend
        run: |
          cat > wrangler.toml <<'EOF'
          name = "slovopad-api"
          main = "worker.js"
          compatibility_date = "2026-11-06"

          [[d1_databases]]
          binding = "DB"
          database_name = "slovopad-cloud"
          database_id = "b98d9cda-1901-4309-90c3-163788ae3590"
          EOF
      - name: Выложить
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml --name slovopad-api --keep-vars
