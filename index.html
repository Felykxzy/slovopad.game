<script>
const tg=window.Telegram&&Telegram.WebApp;
if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#05060f');tg.setBackgroundColor('#05060f');tg.disableVerticalSwipes()}catch(e){}}
const $=id=>document.getElementById(id),cv=$("g"),ctx=cv.getContext("2d");

const FONT="700 19px -apple-system,system-ui,sans-serif",SY=30;
function mk(w,h,fn){const c=document.createElement("canvas");c.width=w*2;c.height=h*2;const x=c.getContext("2d");x.scale(2,2);fn(x);return c}
const T={n:"94,242,255",g:"255,209,102",h:"255,79,216",r:"255,77,109"},S={};
for(const k in T){const c=T[k];S[k]={
orb:mk(64,64,x=>{const g=x.createRadialGradient(32,32,0,32,32,30);g.addColorStop(0,"#fff");g.addColorStop(.18,"rgb("+c+")");g.addColorStop(.5,"rgba("+c+",.25)");g.addColorStop(1,"rgba("+c+",0)");x.fillStyle=g;x.fillRect(0,0,64,64)}),
tr:mk(30,110,x=>{const g=x.createLinearGradient(0,110,0,0);g.addColorStop(0,"rgba("+c+",.7)");g.addColorStop(1,"rgba("+c+",0)");x.fillStyle=g;x.beginPath();x.moveTo(8,110);x.lineTo(22,110);x.lineTo(15,0);x.fill()})}}
function tile(n,r,a){const c=document.createElement("canvas");c.width=c.height=512;const x=c.getContext("2d");
for(let i=0;i<n;i++){x.fillStyle="rgba(200,220,255,"+Math.random()*a+")";x.beginPath();x.arc(Math.random()*512,Math.random()*512,Math.random()*r+.4,0,6.3);x.fill()}return ctx.createPattern(c,"repeat")}
const pat1=tile(180,1,.5),pat2=tile(35,1.6,.9);
const THEMES=[
{id:"brands",n:"БРЕНДЫ",c:"94,242,255",i:"🏷️",w:"найк адидас эппл самсунг тесла пепси фанта сони ауди бмв хонда тойота мерседес лексус нокиа леново интел яндекс озон икеа газпром мегафон сбербанк макдоналдс пума рибок гугл амазон нетфликс спотифай ютуб тикток инстаграм ламода додо"},
{id:"games",n:"ИГРЫ",c:"184,255,92",i:"🎮",w:"дота танки тетрис марио зельда покемон роблокс пакман сталкер ведьмак симс апекс валорант контра хало фифа скайрим террария майнкрафт фортнайт дум гта пабг"},
{id:"cities",n:"ГОРОДА",c:"255,209,102",i:"🏙️",w:"москва париж лондон токио рим берлин мадрид пекин сочи казань омск томск дубай милан прага вена осло лиссабон стамбул чикаго бостон сеул каир афины варшава киев минск самара тверь рига"},
{id:"countries",n:"СТРАНЫ",c:"255,79,216",i:"🌍",w:"россия китай япония франция италия испания германия бразилия египет индия канада мексика турция греция норвегия швеция польша чили перу куба кения ирак иран непал ливан украина австралия аргентина"},
{id:"animals",n:"ЖИВОТНЫЕ",c:"255,138,92",i:"🐾",w:"кот пес лиса волк слон тигр лев заяц медведь жираф зебра пингвин дельфин акула кит орел сова еж крокодил бегемот носорог обезьяна черепаха кенгуру"},
{id:"mix",n:"ВСЁ ПОДРЯД",c:"160,130,255",i:"🎲",w:WORDS.join(" ")}];
let TH=THEMES[5],WL=WORDS;
let CFG={snd:1,vib:1,spd:1,q:1};try{Object.assign(CFG,JSON.parse(localStorage.getItem("cfg")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("cfg",JSON.stringify(CFG))}catch(e){}}
function art(x,id,W,H,al,c){x.save();x.strokeStyle="rgba("+c+","+al+")";x.fillStyle="rgba("+c+","+al*.6+")";x.lineWidth=Math.max(1.5,W/230);
let sd=7;const r=()=>(sd=sd*16807%2147483647)/2147483647,s=Math.min(W,H*1.5),cx=W/2,cy=H/2;
if(id==="brands")for(let i=0;i<7;i++){x.save();x.translate(W*(.1+.8*r()),H*(.15+.7*r()));x.rotate(r()*1.2-.6);const w=s*.16,h=s*.1;x.beginPath();x.moveTo(-w/2,-h/2);x.lineTo(w/2-h/3,-h/2);x.lineTo(w/2,0);x.lineTo(w/2-h/3,h/2);x.lineTo(-w/2,h/2);x.closePath();x.stroke();x.beginPath();x.arc(w/2-h*.45,0,h*.09,0,6.3);x.fill();x.restore()}
else if(id==="games"){x.beginPath();x.moveTo(cx-s*.28,cy-s*.08);x.quadraticCurveTo(cx,cy-s*.2,cx+s*.28,cy-s*.08);x.quadraticCurveTo(cx+s*.42,cy+s*.2,cx+s*.3,cy+s*.22);x.quadraticCurveTo(cx+s*.2,cy+s*.22,cx+s*.15,cy+s*.08);x.lineTo(cx-s*.15,cy+s*.08);x.quadraticCurveTo(cx-s*.2,cy+s*.22,cx-s*.3,cy+s*.22);x.quadraticCurveTo(cx-s*.42,cy+s*.2,cx-s*.28,cy-s*.08);x.stroke();
x.fillRect(cx-s*.24,cy-s*.04,s*.09,s*.025);x.fillRect(cx-s*.2,cy-s*.075,s*.025,s*.09);x.beginPath();x.arc(cx+s*.16,cy-s*.04,s*.022,0,6.3);x.fill();x.beginPath();x.arc(cx+s*.22,cy,s*.022,0,6.3);x.fill();
for(let i=0;i<14;i++){const q=s*(.02+r()*.025);x.strokeRect(W*r(),H*r(),q,q)}}
else if(id==="cities"){let bx=0;while(bx<W){const w=s*(.05+r()*.06),h=H*(.15+r()*.4);x.strokeRect(bx,H-h,w,h);for(let j=0;j<6;j++)x.fillRect(bx+w*.2+(j%2)*w*.4,H-h+h*.1+(j>>1)*h*.25,w*.12,h*.06);bx+=w+2}x.beginPath();x.arc(W*.78,H*.2,s*.06,0,6.3);x.stroke()}
else if(id==="countries"){const R=s*.3;x.beginPath();x.arc(cx,cy,R,0,6.3);x.stroke();for(let i=1;i<4;i++){x.beginPath();x.ellipse(cx,cy,R*i/4,R,0,0,6.3);x.stroke()}
